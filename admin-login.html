<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | MediVault</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }


        .login-card {
            background: white;
            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.12);
        }


        .logo {
            text-align: center;

            color: #0b7285;

            font-size: 30px;
            font-weight: bold;

            margin-bottom: 8px;
        }


        .title {
            text-align: center;

            color: #333;

            margin: 0;
        }


        .subtitle {
            text-align: center;

            color: #666;

            margin:
                10px 0 25px;
        }


        .admin-badge {
            text-align: center;

            margin-bottom: 25px;
        }


        .admin-badge span {
            display: inline-block;

            background: #fff3cd;

            color: #856404;

            padding:
                8px 15px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;
        }


        .form-group {
            margin-bottom: 20px;
        }


        label {
            display: block;

            font-weight: bold;

            color: #333;

            margin-bottom: 8px;
        }


        input {
            width: 100%;

            padding: 13px;

            border:
                1px solid #ccc;

            border-radius: 7px;

            font-size: 16px;
        }


        input:focus {
            outline: none;

            border-color:
                #0b7285;
        }


        .login-button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background:
                #0b7285;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .login-button:hover {
            background:
                #095c6b;
        }


        .login-button:disabled {
            background:
                #999;

            cursor:
                not-allowed;
        }


        .message {
            display: none;

            margin-bottom: 20px;

            padding: 12px;

            border-radius: 7px;

            text-align: center;

            font-size: 14px;
        }


        .message.error {
            display: block;

            background:
                #fff3f3;

            color:
                #c00000;
        }


        .message.success {
            display: block;

            background:
                #f0fff4;

            color:
                #087f23;
        }


        .security-note {
            margin-top: 25px;

            padding: 12px;

            background:
                #f1f8fa;

            border-radius: 8px;

            text-align: center;

            font-size: 13px;

            color: #555;
        }


        .back-link {
            display: block;

            text-align: center;

            margin-top: 20px;

            color:
                #0b7285;

            text-decoration: none;
        }


        footer {
            text-align: center;

            margin-top: 20px;

            color: #777;

            font-size: 13px;
        }


    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <div class="logo">
            💙 MediVault
        </div>


        <h2 class="title">
            Administrator Login
        </h2>


        <p class="subtitle">
            Secure MediVault Administration
        </p>


        <div class="admin-badge">

            <span>
                🔐 ADMINISTRATOR ACCESS
            </span>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <form
            id="adminLoginForm"
        >


            <div class="form-group">

                <label
                    for="adminEmail"
                >
                    Admin Email
                </label>


                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    required
                    autocomplete="username"
                >

            </div>


            <div class="form-group">

                <label
                    for="adminPassword"
                >
                    Password
                </label>


                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter admin password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                id="adminLoginButton"
                class="login-button"
            >

                🔐 Admin Login

            </button>


        </form>


        <div class="security-note">

            🛡️ This portal is restricted to
            authorized MediVault administrators only.

        </div>


        <a
            href="login.html"
            class="back-link"
        >

            ← Patient Login

        </a>


    </div>


    <footer>

        © 2026 MediVault

    </footer>


</div>



<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =================================
   SUPABASE CONFIGURATION
================================= */


const SUPABASE_URL =
    "https://wzstqwuxinbiyommbljl.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_4pyUeXGZuNoSrNgvdMqeeg_lfeq_VoS";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =================================
   ELEMENTS
================================= */


const loginForm =
    document.getElementById(
        "adminLoginForm"
    );


const emailInput =
    document.getElementById(
        "adminEmail"
    );


const passwordInput =
    document.getElementById(
        "adminPassword"
    );


const loginButton =
    document.getElementById(
        "adminLoginButton"
    );


const messageBox =
    document.getElementById(
        "message"
    );



/* =================================
   SHOW ERROR
================================= */


function showError(message) {

    messageBox.className =
        "message error";

    messageBox.textContent =
        message;

}



/* =================================
   SHOW SUCCESS
================================= */


function showSuccess(message) {

    messageBox.className =
        "message success";

    messageBox.textContent =
        message;

}



/* =================================
   CLEAR MESSAGE
================================= */


function clearMessage() {

    messageBox.className =
        "message";

    messageBox.textContent =
        "";

}



/* =================================
   ADMIN LOGIN
================================= */


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        clearMessage();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if (!email || !password) {

            showError(
                "Please enter your email and password."
            );

            return;

        }


        loginButton.disabled =
            true;


        loginButton.textContent =
            "Checking...";


        try {


            /* =========================
               STEP 1
               SUPABASE AUTH LOGIN
            ========================= */


            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .signInWithPassword({

                        email:
                            email,

                        password:
                            password

                    });


            if (error) {

                throw new Error(
                    "Invalid admin email or password."
                );

            }


            if (
                !data ||
                !data.user
            ) {

                throw new Error(
                    "Unable to create login session."
                );

            }



            /* =========================
               STEP 2
               CHECK ADMIN STATUS
            ========================= */


            const {
                data: isAdmin,
                error: adminError
            } =
                await supabaseClient
                    .rpc(
                        "is_admin"
                    );


            if (adminError) {

                console.error(
                    adminError
                );


                await supabaseClient
                    .auth
                    .signOut();


                throw new Error(
                    "Unable to verify administrator privileges."
                );

            }


            /* =========================
               STEP 3
               NOT ADMIN
            ========================= */


            if (isAdmin !== true) {

                await supabaseClient
                    .auth
                    .signOut();


                throw new Error(
                    "This account is not authorized as a MediVault administrator."
                );

            }



            /* =========================
               STEP 4
               SUCCESS
            ========================= */


            showSuccess(
                "Admin verification successful. Opening Admin Portal..."
            );


            loginButton.textContent =
                "Access Granted";


            setTimeout(
                function() {

                    window.location.href =
                        "admin.html";

                },
                800
            );


        }


        catch (error) {

            console.error(
                "Admin Login Error:",
                error
            );


            showError(
                error.message ||
                "Admin login failed."
            );


            loginButton.disabled =
                false;


            loginButton.textContent =
                "🔐 Admin Login";

        }

    }
);



/* =================================
   CLEAR ERROR WHEN TYPING
================================= */


emailInput.addEventListener(
    "input",
    clearMessage
);


passwordInput.addEventListener(
    "input",
    clearMessage
);



/* =================================
   CHECK EXISTING SESSION
================================= */


async function checkExistingAdminSession() {

    try {


        const {
            data: {
                session
            }
        } =
            await supabaseClient
                .auth
                .getSession();


        if (!session) {

            return;

        }


        const {
            data: isAdmin,
            error
        } =
            await supabaseClient
                .rpc(
                    "is_admin"
                );


        if (error) {

            return;

        }


        if (isAdmin === true) {

            window.location.href =
                "admin.html";

        }


    }


    catch (error) {

        console.error(
            "Session check error:",
            error
        );

    }

}



/* =================================
   START
================================= */


checkExistingAdminSession();


</script>
    
<script>
alert("MediVault Admin Login JavaScript is working!");
</script>

</body>

    </html>
