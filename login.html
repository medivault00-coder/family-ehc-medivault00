<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MediVault</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            color: #0b7285;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #0b7285;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #0b7285;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #095c6b;
        }

        .login-button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0b7285;
            text-decoration: none;
        }

        .security-note {
            margin-top: 25px;
            padding: 12px;
            background: #f1f8fa;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            color: #555;
        }

        .message {
            display: none;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 7px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            display: block;
            background: #fff3f3;
            color: #c00000;
        }

        .success {
            display: block;
            background: #f0fff4;
            color: #087f23;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            💙 MediVault
        </div>

        <p class="subtitle">
            Secure Electronic Health Card System
        </p>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="form-group">

                <label for="patientId">
                    Patient ID
                </label>

                <input
                    type="text"
                    id="patientId"
                    placeholder="Example: MV-1001"
                    required>

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton">

                Login

            </button>

        </form>

        <div class="security-note">
            🔐 Your health information is protected with secure authentication.
        </div>

        <a
            href="https://medivault00-coder.github.io/family-ehc-medivault00/"
            class="back-link">

            ← Back to MediVault

        </a>

    </div>

    <footer>
        © 2026 MediVault
    </footer>

</div>


<!-- Supabase JavaScript Library -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    // Supabase Configuration

    const SUPABASE_URL =
        "https://wzstqwuxinbiyommbljl.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_4pyUeXGZuNoSrNgvdMqeeg_lfeq_VoS";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // Login Form

    const loginForm =
        document.getElementById("loginForm");

    const patientIdInput =
        document.getElementById("patientId");

    const passwordInput =
        document.getElementById("password");

    const loginButton =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const patientId =
                patientIdInput.value.trim();

            const password =
                passwordInput.value;


            message.className = "message";
            message.textContent = "";

            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";


            try {

                // Get Auth Email from Patient ID

                const { data: authEmail, error: emailError } =
                    await supabaseClient.rpc(
                        "get_auth_email_by_patient_id",
                        {
                            p_patient_id: patientId
                        }
                    );


                if (emailError) {
                    throw emailError;
                }


                if (!authEmail) {

                    throw new Error(
                        "Patient ID not found."
                    );

                }


                // Login with Supabase Auth

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({

                        email: authEmail,

                        password: password

                    });


                if (error) {
                    throw error;
                }


                // Login successful

                message.className =
                    "message success";

                message.textContent =
                    "Login successful. Opening your EHC...";


                // Open EHC

                setTimeout(function() {

                    window.location.href =
                        "member1.html";

                }, 800);


            } catch (error) {

                console.error(error);

                message.className =
                    "message error";

                message.textContent =
                    "Login failed. Please check your Patient ID and Password.";

                loginButton.disabled = false;

                loginButton.textContent =
                    "Login";

            }

        }

    );

</script>

</body>
    </html>
