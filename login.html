<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MediVault</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            color: #0b7285;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #0b7285;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #0b7285;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #095c6b;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0b7285;
            text-decoration: none;
        }

        .security-note {
            margin-top: 25px;
            padding: 12px;
            background: #f1f8fa;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            color: #555;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                💙 MediVault
            </div>

            <p class="subtitle">
                Secure Electronic Health Card System
            </p>

            <form>

                <div class="form-group">
                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>
                </div>


                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>
                </div>


                <button
                    type="submit"
                    class="login-button">
                    Login
                </button>

            </form>


            <div class="security-note">
                🔐 Your personal health information should be protected
                with secure authentication.
            </div>


            <a
                href="https://medivault00-coder.github.io/family-ehc-medivault00/"
                class="back-link">
                ← Back to MediVault
            </a>

        </div>


        <footer>
            © 2026 MediVault
        </footer>

    </div>

</body>
</html>
